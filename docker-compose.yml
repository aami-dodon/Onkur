# Onkur stack
#
#   backend   Express API on http://localhost:1011
#   frontend  Vite dev server on http://localhost:1010
#   gateway   nginx on http://localhost:${GATEWAY_PORT:-1012}; routes /api to the
#             backend and everything else to the frontend
#   tunnel    named Cloudflare tunnel that publishes the gateway at
#             https://onkur.dodon.in
#
# CLOUDFLARE_TUNNEL_TOKEN comes from the .env at the repo root (copy
# .env.example). In the Cloudflare dashboard the tunnel's public hostname
# onkur.dodon.in must point to the service http://gateway:80.

services:
  backend:
    build: ./backend
    env_file:
      - ./backend/.env
    ports:
      - "1011:5000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    env_file:
      - ./frontend/.env
    ports:
      - "1010:5173"
    restart: unless-stopped

  gateway:
    image: nginx:1.27-alpine
    ports:
      - "${GATEWAY_PORT:-1012}:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
      - frontend
    restart: unless-stopped

  # An empty CLOUDFLARE_TUNNEL_TOKEN makes this container exit; nothing else
  # depends on it, so the stack still runs locally.
  tunnel:
    image: cloudflare/cloudflared:2026.9.1
    command: ["tunnel", "--no-autoupdate", "run", "--url", "http://gateway:80"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
    depends_on:
      - gateway
